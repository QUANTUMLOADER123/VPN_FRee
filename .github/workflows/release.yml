name: Build Windows release

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Chrome.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Publish release
        if: contains(github.event.head_commit.message, '[release ')
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: pwsh
        run: |
          if ($env:COMMIT_MESSAGE -notmatch '\[release (v\d+\.\d+\.\d+)\]') {
            throw 'Commit message must contain a release marker, e.g. [release v0.1.0].'
          }
          $tag = $Matches[1]
          $notes = @'
          Демонстрационный каркас Windows-приложения на C++.

          - Запуск без консольного окна.
          - OK завершает приложение; крестик переводит его в фон.
          - Для выхода из фонового режима используйте контекстное меню значка в области уведомлений.
          - Приложение не является Google Chrome или VPN и не проверяет, установлена ли программа.
          - Сборка предназначена для Windows x64.
          '@
          Set-Content -Path release-notes.txt -Value $notes -Encoding utf8
          gh release create $tag build/x64/Release/Chrome.exe --target $env:GITHUB_SHA --title "$tag — Windows x64" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
